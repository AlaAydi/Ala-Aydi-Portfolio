<header [class.scrolled]="isScrolled"
  (mousemove)="onHeaderMouseMove($event)"
  (mouseleave)="onHeaderMouseLeave()"
  [style.--tiltX.deg]="tiltX"
  [style.--tiltY.deg]="tiltY">

  <div class="container nav">

    <div class="logo-cube" (click)="scrollToSection('hero')" tabindex="0" aria-label="Back to top">
      <span class="face front">&lt;/&gt;</span>
      <span class="face top"></span>
      <span class="face side"></span>
      <span class="shadow"></span>
    </div>

    <nav class="dock">
      <a *ngFor="let item of navItems"
         class="key"
         (click)="scrollToSection(item.targetId)"
         [class.active]="activeSection === item.targetId">
        <span class="key-label">{{ item.label }}</span>
      </a>
    </nav>

    <div class="header-actions">
      <!-- Theme Toggle -->
      <button class="theme-toggle" (click)="toggleTheme()" [title]="isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'" aria-label="Toggle theme">
        <!-- Sun Icon (show in dark mode) -->
        <svg *ngIf="isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon (show in light mode) -->
        <svg *ngIf="!isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <!-- Hamburger -->
      <button class="hamburger" (click)="toggleMenu()" aria-label="Menu">
        <span [class.open]="isMenuOpen"></span>
        <span [class.open]="isMenuOpen"></span>
        <span [class.open]="isMenuOpen"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" *ngIf="isMenuOpen">
    <a *ngFor="let item of navItems"
       class="key mobile"
       (click)="scrollToSection(item.targetId)"
       [class.active]="activeSection === item.targetId">
      {{ item.label }}
    </a>
  </div>
</header>
