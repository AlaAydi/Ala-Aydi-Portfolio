<section id="skills" class="skills" #skillsSection>
  <div class="container">

    <div class="section-header">
      <span class="section-tag">// skills.map()</span>
      <h2 class="section-title">Tech <span class="gradient-text">Stack</span></h2>
      <p class="section-subtitle">Technologies I work with to build scalable, modern applications.</p>
    </div>

    <!-- Filter tabs -->
    <div class="filter-tabs reveal">
      <button
        class="filter-tab"
        [class.active]="activeFilter === 'all'"
        (click)="setFilter('all')"
      >All</button>
      <button
        class="filter-tab"
        *ngFor="let cat of categories"
        [class.active]="activeFilter === cat.name"
        [style.--cat-color]="cat.color"
        (click)="setFilter(cat.name)"
      >{{ cat.name }}</button>
    </div>

    <!-- Skills Categories Grid -->
    <div class="categories-grid reveal">
      <div
        class="category-card glass-card"
        *ngFor="let cat of filteredCategories"
        [style.--cat-color]="cat.color"
      >
        <div class="category-header">
          <span class="category-icon">{{ cat.icon }}</span>
          <h3 class="category-name">{{ cat.name }}</h3>
        </div>
        <div class="skills-chips">
          <span class="skill-chip" *ngFor="let skill of cat.skills">
            <span class="chip-dot"></span>
            {{ skill }}
          </span>
        </div>
      </div>
    </div>

    <!-- 3D Skills Graph (hidden on mobile, shown above) -->
    <div
      class="skills-visual reveal"
      #visual
      (mousemove)="onVisualMouseMove($event)"
      (mouseleave)="onVisualMouseLeave()">
      <canvas #threeCanvas class="three-canvas"></canvas>
      <span
        class="node-label"
        *ngFor="let skill of flatSkills"
        #label
        [style.--node-color]="skill.color">
        {{ skill.label }}
      </span>
    </div>

  </div>
</section>
