<section id="skills" class="skills" #skillsSection>
  <div class="container">

    <p class="eyebrow reveal">Compétences<span class="dot"></span></p>
    <h2 class="section-title reveal">Ce que je maîtrise</h2>

    <div class="legend reveal">
      <span class="legend-item" *ngFor="let cat of categories" [style.--cat-color]="cat.color">
        <span class="legend-dot"></span>{{ cat.name }}
      </span>
    </div>

    <div
      class="skills-visual reveal"
      #visual
      (mousemove)="onVisualMouseMove($event)"
      (mouseleave)="onVisualMouseLeave()">

      <canvas #threeCanvas class="three-canvas"></canvas>

      <span
        class="node-label"
        *ngFor="let skill of flatSkills"
        #label
        [style.--node-color]="skill.color">
        {{ skill.label }}
      </span>
    </div>

    <div class="categories-grid reveal">
      <div class="category-card card" *ngFor="let cat of categories" [style.--cat-color]="cat.color">
        <h3 class="category-name">
          <span class="category-dot"></span>{{ cat.name }}
        </h3>
        <div class="tags">
          <span class="tag" *ngFor="let skill of cat.skills">{{ skill }}</span>
        </div>
      </div>
    </div>

  </div>
</section>
