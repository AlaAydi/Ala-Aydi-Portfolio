<section class="experiences-section" #experienceSection>

  <div class="section-header">
    <span class="section-tag">// experience.log()</span>

    <h2 class="section-title">
      Work <span class="gradient-text">Timeline</span>
    </h2>

    <p class="section-subtitle">
      My professional journey, internships, and education milestones.
    </p>
  </div>

  <div class="timeline-wrap" #timelineWrap>

    <!-- Animated line -->
    <canvas #lineCanvas class="timeline-canvas"></canvas>

    <div class="timeline-line"></div>

    <div
      class="timeline-item reveal"
      *ngFor="let exp of experiences; let i = index"
      #itemEl
      [style.--exp-color]="exp.color"
      [style.transition-delay]="(i * 0.12) + 's'"
      [class.left]="i % 2 === 0"
      [class.right]="i % 2 !== 0"
    >

      <!-- Timeline dot / icon -->
      <span
        class="timeline-dot"
        [style.background]="exp.color"
      >

        <!-- Education icon -->
        <svg
          *ngIf="exp.icon === 'education'"
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path d="M22 10 12 5 2 10l10 5 10-5Z"/>
          <path d="M6 12v5c0 1.5 2.5 3 6 3s6-1.5 6-3v-5"/>
        </svg>

        <!-- Web / computer icon -->
        <svg
          *ngIf="exp.icon === 'web'"
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <rect
            x="2"
            y="3"
            width="20"
            height="14"
            rx="2"
          />
          <line
            x1="8"
            y1="21"
            x2="16"
            y2="21"
          />
          <line
            x1="12"
            y1="17"
            x2="12"
            y2="21"
          />
        </svg>

        <!-- Work / briefcase icon -->
        <svg
          *ngIf="exp.icon === 'work'"
          viewBox="0 0 24 24"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <rect
            x="2"
            y="7"
            width="20"
            height="14"
            rx="2"
          />
          <path
            d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"
          />
        </svg>

      </span>

      <!-- Experience card -->
      <div class="timeline-card glass-card">

        <div
          class="card-accent"
          [style.background]="exp.color"
        ></div>

        <div class="card-head">

          <div class="card-meta">

            <h3 class="exp-role">
              {{ exp.role }}
            </h3>

            <p class="exp-company">
              <span class="company-dot"></span>
              {{ exp.company }}
            </p>

          </div>

          <span class="exp-period">
            {{ exp.period }}
          </span>

        </div>

        <p class="exp-description">
          {{ exp.description }}
        </p>

        <div class="exp-tags">

          <span
            class="exp-tag"
            *ngFor="let tag of exp.tags"
          >
            {{ tag }}
          </span>

        </div>

      </div>

    </div>

  </div>

</section>
```
