<!-- Floating Launcher Button -->
<button class="terminal-launcher" (click)="toggleTerminal()" [class.active]="isOpen" title="Open Terminal (ala.sh)">
  <span class="launcher-icon">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="4 17 10 11 4 5"></polyline>
      <line x1="12" y1="19" x2="20" y2="19"></line>
    </svg>
  </span>
  <span class="launcher-label">ala.sh</span>
</button>

<!-- Terminal Modal -->
<div class="terminal-backdrop" *ngIf="isOpen" (click)="closeTerminal()"></div>
<div class="terminal-window" [class.open]="isOpen">
  <div class="terminal-titlebar">
    <div class="window-dots">
      <button class="dot dot-red" (click)="closeTerminal()" title="Close"></button>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
    </div>
    <span class="window-title">ala.sh — portfolio shell</span>
    <button class="close-btn" (click)="closeTerminal()">✕</button>
  </div>

  <div class="terminal-body" #terminalBody>
    <div class="output-line" *ngFor="let line of history" [ngClass]="line.type">
      <pre [innerHTML]="line.content"></pre>
    </div>
  </div>

  <div class="terminal-input-row">
    <span class="prompt-user">ala</span><span class="prompt-at">@</span><span class="prompt-host">portfolio</span><span class="prompt-colon">:</span><span class="prompt-path">~</span><span class="prompt-dollar">$</span>
    <input
      #terminalInput
      type="text"
      class="terminal-input"
      [(ngModel)]="inputCommand"
      (keydown)="handleKeyDown($event)"
      placeholder="type 'help' for commands..."
      spellcheck="false"
      autocomplete="off"
    />
  </div>
</div>
