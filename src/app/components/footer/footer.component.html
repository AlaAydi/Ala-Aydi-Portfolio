<footer class="footer" #footerEl>

  <div class="canvas-wrap" #canvasWrap>
    <canvas #waveCanvas class="wave-canvas"></canvas>
  </div>

  <button
    class="back-to-top"
    [class.visible]="showBackToTop"
    (click)="scrollToTop()"
    aria-label="Retour en haut">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4">
      <line x1="12" y1="19" x2="12" y2="5"/>
      <polyline points="5 12 12 5 19 12"/>
    </svg>
  </button>

  <div class="container">
    <div class="footer-top">

      <div class="footer-brand">
        <h3 class="brand-name">Aydi<span class="brand-dot">.</span>Ala</h3>
        <p class="brand-tagline">
          Étudiant en génie logiciel, passionné par le développement web full-stack.
        </p>

        <div class="footer-socials">
            <a
            *ngFor="let social of socials"
            [href]="social.href"
            [target]="social.icon !== 'mail' ? '_blank' : null"
            [attr.rel]="social.icon !== 'mail' ? 'noopener' : null"
            class="social-btn"
            [attr.aria-label]="social.label">
            <svg *ngIf="social.icon === 'github'" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 0a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7 0-.7 0-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 0z"/>
            </svg>
            <svg *ngIf="social.icon === 'linkedin'" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M19 0h-14c-2.76 0-5 2.24-5 5v14c0 2.76 2.24 5 5 5h14c2.76 0 5-2.24 5-5v-14c0-2.76-2.24-5-5-5zm-11 19h-3v-9h3v9zm-1.5-10.3c-1 0-1.7-.7-1.7-1.6s.7-1.6 1.7-1.6 1.7.7 1.7 1.6-.7 1.6-1.7 1.6zm13.5 10.3h-3v-4.7c0-1.3-.5-2.2-1.7-2.2-.9 0-1.4.6-1.7 1.2-.1.2-.1.5-.1.8v4.9h-3s.1-8 0-9h3v1.3c.4-.6 1.1-1.5 2.8-1.5 2 0 3.6 1.3 3.6 4.2v5z"/>
            </svg>
            <svg *ngIf="social.icon === 'mail'" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>
            </svg>
          </a>
        </div>
      </div>

      <nav class="footer-links">
        <h4 class="links-title">Navigation</h4>
        <a *ngFor="let link of quickLinks" [href]="link.href" class="footer-link">
          {{ link.label }}
        </a>
      </nav>

      <div class="footer-contact">
        <h4 class="links-title">Contact</h4>
     <a href="mailto:aydi.ala@etudiant-fst.utm.tn" class="footer-link">
  aydi.ala&#64;etudiant-fst.utm.tn
</a>
        <a href="tel:+21627983973" class="footer-link">+216 27 983 973</a>
        <span class="footer-link no-link">Ariana, Tunisie</span>
      </div>

    </div>

    <div class="footer-bottom">
      <p class="copyright">© {{ currentYear }} Aydi Ala. Tous droits réservés.</p>
      <p class="made-with">Conçu et développé avec <span class="heart">♥</span> et Angular</p>
    </div>
  </div>

</footer>
