<section id="hero" class="hero" #heroSection>
  <canvas #threeCanvas class="three-canvas"></canvas>

  <!-- Background layers -->
  <div class="hero-noise"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Floating code snippets -->
  <div class="floating-code code-1">
    <span class="code-keyword">const</span> dev = <span class="code-string">"Ala Aydi"</span>;
  </div>
  <div class="floating-code code-2">
    <span class="code-keyword">export</span> <span class="code-func">buildMagic</span>();
  </div>
  <div class="floating-code code-3">
    &lt;<span class="code-tag">Portfolio</span> <span class="code-attr">mode</span>=<span class="code-string">"premium"</span> /&gt;
  </div>

  <div class="container hero-grid"
       #visual
       (mousemove)="onVisualMouseMove($event)"
       (mouseleave)="onVisualMouseLeave()">

    <div class="hero-text" [class.revealed]="isRevealed">

      <!-- Available badge -->
      <div class="available-badge">
        <span class="pulse-ring"></span>
        <span class="pulse-dot"></span>
        <span class="badge-text">Available for work</span>
      </div>

      <!-- Intro line -->
      <div class="intro-line">
        <span class="wave">👋</span>
        <span>Hi, I'm <span class="name-highlight">{{ displayedName }}</span><span class="cursor-blink">|</span></span>
      </div>

      <!-- Main title -->
      <h1 class="hero-title">
        <span class="title-static">Software</span>
        <span class="title-animated gradient-text">{{ currentRole }}</span>
      </h1>

      <p class="tagline">{{ tagline }}</p>

      <!-- CTA buttons -->
      <div class="cta-row">
        <button class="btn btn-cyan" id="hero-cta-project" (click)="scrollToSection('projects')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
          View My Work
        </button>
        <a class="btn btn-outline" id="hero-cta-cv" href="assets/aydicv.pdf" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Download CV
        </a>
      </div>

      <!-- Social links -->
      <div class="social-row">
        <a href="https://github.com/" target="_blank" rel="noopener" class="social-link" aria-label="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        </a>
        <a href="https://linkedin.com/" target="_blank" rel="noopener" class="social-link" aria-label="LinkedIn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        </a>
        <a href="mailto:med.ala.aydi@gmail.com" class="social-link" aria-label="Email">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        </a>
      </div>
    </div>

    <!-- Hero Visual -->
    <div class="hero-visual" [class.revealed]="isRevealed">
      <div class="photo-container"
           [style.--rx]="tiltX + 'deg'"
           [style.--ry]="tiltY + 'deg'">

        <div class="glow-ring"></div>

        <div class="photo-frame">
          <img src="assets/images/ala.png"
               alt="Portrait de {{ name }}"
               class="hero-photo"
               loading="eager" />
          <div class="photo-overlay"></div>
        </div>

        <div class="orbit-ring">
          <div class="orbit-dot"></div>
        </div>

        <!-- Stats badges -->
        <div class="stat-badge stat-badge-1">
          <span class="stat-icon">🚀</span>
          <div class="stat-content">
            <span class="stat-value">{{ animatedProjectCount }}+</span>
            <span class="stat-label">Projects</span>
          </div>
        </div>

        <div class="stat-badge stat-badge-2">
          <span class="stat-icon">⚡</span>
          <div class="stat-content">
            <span class="stat-value">{{ animatedExpYears }}+</span>
            <span class="stat-label">Years Exp.</span>
          </div>
        </div>

        <!-- Tech floating icons -->
        <div class="tech-float tech-1" title="Angular">
          <i class="fa-brands fa-angular"></i>
        </div>
        <div class="tech-float tech-2" title="JavaScript">
          <i class="fa-brands fa-js"></i>
        </div>
        <div class="tech-float tech-3" title="Node.js">
          <i class="fa-brands fa-node-js"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator" [class.revealed]="isRevealed">
    <div class="mouse">
      <div class="wheel"></div>
    </div>
    <span>Scroll</span>
  </div>
</section>
